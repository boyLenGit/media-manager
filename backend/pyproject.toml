[project]
name = "media-manager-backend"
version = "0.1.0"
description = "Media Manager - NAS 资源库与视频管理系统后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "charset-normalizer>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]
